name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://pulse:pulse@localhost:5432/pulse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  containers:
    name: Build and smoke-test the stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: cp .env.example .env
      - name: Start every container and wait for health checks
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Exercise the API through the web container
        run: |
          curl --fail --silent http://localhost:8080/api/health
          npm run seed
          curl --fail --silent http://localhost:8080/api/summary | grep -q '"safeToSpend":{'
          curl --fail --silent http://localhost:8080/ | grep -q '<div id="root">'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
